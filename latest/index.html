<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FOD 环境检测 · 下载最新版</title>
<style>
  body{background:#0d1117;color:#c9d1d9;margin:0;height:100vh;display:flex;
       align-items:center;justify-content:center;text-align:center;padding:24px;
       font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .t{font-size:17px;font-weight:600;margin-bottom:10px;color:#e6edf3}
  .d{color:#8b95a1;font-size:13.5px}
  a{color:#4a9eff;text-decoration:none}
</style></head>
<body>
<div>
  <div class="t">FOD 环境检测</div>
  <div class="d" id="m">正在获取最新版本…</div>
  <div class="d" id="a" style="margin-top:14px"></div>
</div>
<script>
fetch('../version.json?t=' + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (v) {
    if (!v || !v.url) throw new Error('bad');
    document.getElementById('m').textContent =
      '最新版 v' + v.versionName + '（' + v.size + '），正在跳转下载…';
    var url = v.url;
    document.getElementById('a').innerHTML =
      '没有自动开始？<a href="' + url + '">点这里下载</a>';
    setTimeout(function () { location.replace(url); }, 600);
  })
  .catch(function () {
    document.getElementById('m').textContent = '获取版本信息失败';
    document.getElementById('a').innerHTML =
      '<a href="../fod-diag.apk">直接下载</a>';
  });
</script>
</body></html>
